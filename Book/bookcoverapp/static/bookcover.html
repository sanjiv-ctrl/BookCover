<!DOCTYPE html>
<html>
<head>
    <title>Book Front Cover</title>
    <style>
        body {
            background: linear-gradient(to right, #d7d2cc, #304352);
            font-family: Arial, sans-serif;
            padding-top: 30px;
        }
        
        /* This single box is the front cover of the book */
        .book-cover {
            width: 380px;
            height: 550px;
            background-color: rgb(128, 0, 111);
            color: white;
            padding: 30px;
            margin: auto; /* Centers the book on screen */
            border: 5px solid rgb(30, 26, 5);
            text-align: center; /* Centers all text and images */
        }

        h1 {
            color: gold;
            font-size: 32px;
            margin-top: 20px;
        }

        h3 {
            color: lightgray;
            font-weight: normal;
        }

        img {
            width: 180px;
            height: 180px;
            border: 3px solid gold;
            margin: 30px 0;
        }

        .author {
            color: gold;
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="book-cover">
        <p>FIRST EDITION</p>
        <hr>

        <h1>TBBT<br>PRESENTS</h1>
        <h3>The Big Bang Theory</h3>

        <!-- Put any cover image named book.jpg in your static folder -->
        <img src="author.jpg" alt="Book Cover Image">

        <hr>
        <p class="author">By Sanjiv Kumar</p>
        <p>Cooper's Publications</p>
    </div>

</body>
</html>
